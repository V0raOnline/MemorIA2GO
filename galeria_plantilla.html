<style>
/* Los mismos tokens que la app (web/style.css): warm por defecto, cool y light.
   Si cambian alli, cambian aqui: los copia galeria.py al generar la pagina. */
/*__TOKENS__*/
:root { --sombra: 0 10px 40px rgba(0, 0, 0, 0.55); }
:root[data-theme="light"] { --sombra: 0 10px 40px rgba(60, 40, 20, 0.18); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--cyan); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select, input { font: inherit; color: inherit; }

header {
  position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; padding: 12px 20px;
}
.marca { font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.marca .ia { color: var(--brand); }
.marca small { font-weight: 400; color: var(--text-dim); margin-left: 6px; }
.buscar { flex: 1 1 280px; position: relative; }
.buscar input {
  width: 100%; padding: 8px 12px 8px 32px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-inset); outline: none;
}
.buscar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.buscar::before { content: "⌕"; position: absolute; left: 11px; top: 6px; color: var(--text-dim); font-size: 16px; }
.acciones { display: flex; gap: 8px; align-items: center; }
#b-filtros .n {
  display: inline-block; margin-left: 7px; min-width: 18px; padding: 0 6px; border-radius: 999px;
  background: var(--accent); color: var(--bg); font-size: 11.5px; font-weight: 700; text-align: center;
}
#b-filtros .n:empty { display: none; }
#b-filtros[aria-expanded="true"] { border-color: var(--accent); }
.panel-filtros {
  width: 100%; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 12px;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px;
}
.panel-filtros[hidden] { display: none; }
.grupo-f { display: flex; align-items: center; gap: 8px; }
.etq-f { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--bg-inset); border: 0; padding: 6px 11px; cursor: pointer; color: var(--text-dim); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
select, .btn {
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; cursor: pointer;
  max-width: 220px;
}
.btn:hover, select:hover { border-color: var(--accent); }
select.activo { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.resumen { width: 100%; color: var(--text-dim); font-size: 12.5px; font-family: var(--mono); }
.resumen b { color: var(--accent); font-weight: 600; }

main { padding: 6px 20px 60px; max-width: 1500px; margin: 0 auto; }
.mes > h2 {
  position: sticky; top: var(--alto-cabecera, 120px); z-index: 10; background: var(--bg);
  margin: 0; padding: 14px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text-dim);
}
.mes > h2 span { color: var(--accent); font-family: var(--mono); letter-spacing: 0; margin-left: 6px; }

details.conv { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; margin: 0 0 8px; }
details.conv[open] { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: 18px 46px 92px 1fr auto auto;
  align-items: center; gap: 10px; padding: 9px 12px;
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; color: var(--text-dim); transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); color: var(--accent); }
.portada { width: 46px; height: 46px; border-radius: 6px; overflow: hidden; background: var(--bg-inset);
  border: 1px solid var(--border); display: grid; place-items: center; color: var(--text-dim); }
.portada img { width: 100%; height: 100%; object-fit: cover; display: block; }
details[open] .portada { opacity: .35; }
.fecha { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.titulo { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.etiquetas { display: flex; gap: 5px; }
.etq-prov {
  font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; color: var(--text-dim);
  white-space: nowrap;
}
.cuenta {
  font-family: var(--mono); font-size: 12px; background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; padding: 1px 9px; min-width: 30px; text-align: center;
}

.cuerpo { padding: 0 12px 12px 40px; }
.tira { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; scroll-snap-type: x proximity; }
.tira::-webkit-scrollbar { height: 8px; }
.tira::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
figure {
  margin: 0; flex: 0 0 auto; width: 180px; scroll-snap-align: start; cursor: zoom-in; position: relative;
  background: var(--bg-inset); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  transition: transform .12s, border-color .12s;
}
figure:hover { transform: translateY(-2px); border-color: var(--accent); }
figure img, figure video { display: block; width: 100%; height: 180px; object-fit: cover; background: var(--bg-inset); }
.insignia {
  position: absolute; top: 6px; left: 6px; font-size: 10.5px; padding: 1px 6px; border-radius: 999px;
  background: rgba(0, 0, 0, .65); color: #fff;
}
.pie {
  padding: 6px 8px 8px; font-size: 12px; color: var(--text-dim);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em;
}
.pie strong { color: var(--text); font-weight: 600; }
.sin-mini {
  height: 180px; display: grid; place-items: center; color: var(--text-dim); font-size: 12px; text-align: center; padding: 8px;
  background: repeating-linear-gradient(45deg, var(--bg-inset), var(--bg-inset) 8px, var(--bg-panel) 8px, var(--bg-panel) 16px);
}
.pie-conv { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; font-size: 12.5px; margin-top: 2px; }
.peticion { color: var(--text-dim); flex: 1 1 400px; }
.peticion em { color: var(--text); font-style: normal; }
.vacio { color: var(--text-dim); text-align: center; padding: 60px 0; }

/* Footer: el mismo que la app (web/style.css, ver .claude/footer.TXT). */
footer {
  max-width: 1500px; margin: 0 auto; padding: 1.2rem 20px 2rem; border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.6rem;
}
.footer-left, .footer-right { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); letter-spacing: 0.03em; }
.footer-right a { color: var(--accent); text-decoration: none; transition: opacity 0.2s; }
.footer-right a:hover { opacity: 0.75; }

.visor {
  position: fixed; inset: 0; z-index: 50; display: none; background: rgba(0, 0, 0, .82);
  grid-template-columns: 1fr minmax(260px, 340px);
}
.visor.abierto { display: grid; }
.visor .lienzo { display: grid; place-items: center; padding: 30px; position: relative; min-width: 0; }
.visor .lienzo img, .visor .lienzo video { max-width: 100%; max-height: 88vh; border-radius: 8px; box-shadow: var(--sombra); }
.visor .lado { background: var(--bg-panel); color: var(--text); padding: 22px 20px; overflow-y: auto; border-left: 1px solid var(--border); }
.visor h3 { margin: 0 0 4px; font-size: 16px; padding-right: 84px; }
.visor .meta { font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.visor .datos { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.visor .etq { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin: 14px 0 4px; }
.visor .txt { font-size: 13px; white-space: pre-wrap; }
.visor .enlaces { display: grid; gap: 8px; margin-top: 18px; }
.visor .enlaces a { display: block; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; }
.visor .enlaces a:hover { border-color: var(--accent); text-decoration: none; }
.nav {
  position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--bg-panel); color: var(--text); cursor: pointer; font-size: 20px;
}
.nav.ant { left: 14px; } .nav.sig { right: 14px; }
.cerrar { position: absolute; top: 12px; right: 14px; }
@media (max-width: 760px) {
  header { padding: 10px 12px; } main { padding: 4px 12px 40px; }
  summary { grid-template-columns: 14px 40px 1fr auto; }
  .portada { width: 40px; height: 40px; }
  .fecha, .etiquetas { display: none; }
  .cuerpo { padding: 0 10px 10px; }
  figure { width: 140px; } figure img, figure video, .sin-mini { height: 140px; }
  .visor { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .visor .lado { max-height: 40vh; border-left: 0; border-top: 1px solid var(--border); }
}
</style>

<body>
<header id="cabecera">
  <div class="marca">M3M0R<span class="ia">·IA</span><small>galería</small></div>
  <div class="buscar"><input id="q" type="search" placeholder="Buscar en títulos, prompts, lo que pediste, proyectos…  ( / )" autocomplete="off"></div>
  <div class="acciones">
    <button class="btn" id="b-filtros" type="button" aria-expanded="false" aria-controls="panel-filtros">Filtros<span class="n" id="n-filtros"></span></button>
    <button class="btn" id="plegar" type="button">Desplegar todo</button>
    <select id="tema" title="Tema"><option value="warm">warm</option><option value="cool">cool</option><option value="light">claro</option></select>
  </div>
  <div class="panel-filtros" id="panel-filtros" hidden>
    <div class="grupo-f"><span class="etq-f">Origen</span>
      <div class="seg" id="f-origen" role="group" aria-label="Origen" data-valor=""><button type="button" data-v="" aria-pressed="true">Todo</button><button type="button" data-v="generada" aria-pressed="false">Generadas</button><button type="button" data-v="subida" aria-pressed="false">Subidas</button></div>
    </div>
    <div class="grupo-f"><span class="etq-f">Tipo</span>
      <div class="seg" id="f-tipo" role="group" aria-label="Tipo" data-valor=""><button type="button" data-v="" aria-pressed="true">Todo</button><button type="button" data-v="imagen" aria-pressed="false">Imágenes</button><button type="button" data-v="video" aria-pressed="false">Vídeos</button></div>
    </div>
    <select id="f-prov" title="Proveedor"><option value="">Todos los proveedores</option></select>
    <select id="f-gen" title="Generador"><option value="">Todos los generadores</option></select>
    <select id="f-proy" title="Proyecto"><option value="">Todos los proyectos</option></select>
    <select id="f-mes" title="Mes"><option value="">Todos los meses</option></select>
    <button class="btn" id="limpiar" type="button">Quitar filtros</button>
  </div>
  <div class="resumen" id="resumen"></div>
</header>
<main id="lista"></main>
<footer>
  <div class="footer-left"><strong>M3M0R·IA</strong> · Own your AI memory</div>
  <div class="footer-right">
    <a href="https://github.com/V0raOnline/MemorIA2GO" target="_blank" rel="noopener">GitHub</a>
    ·
    <a href="https://v0raonline.substack.com" target="_blank" rel="noopener">Substack</a>
  </div>
</footer>

<div class="visor" id="visor" aria-modal="true" role="dialog">
  <div class="lienzo" id="lienzo">
    <button class="nav ant" id="ant" type="button" aria-label="Anterior">‹</button>
    <div id="v-medio"></div>
    <button class="nav sig" id="sig" type="button" aria-label="Siguiente">›</button>
  </div>

    <button class="btn cerrar" id="cerrar" type="button">Cerrar ✕</button>
    <h3 id="v-titulo"></h3>
    <div class="meta" id="v-meta"></div>
    <div class="datos" id="v-datos"></div>
    <div id="v-prompt-b"><div class="etq">Prompt</div><div class="txt" id="v-prompt"></div></div>
    <div id="v-pet-b"><div class="etq">Lo que pediste</div><div class="txt" id="v-pet"></div></div>
    <div class="enlaces">
      <a id="v-obs" href="#">↗ Abrir en Obsidian</a>
      <a id="v-orig" href="#" target="_blank" rel="noopener">⤢ Abrir el original</a>
    </div>
  </aside>
</div>

<script>
const DATOS = /*__DATOS__*/null;
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const ETQ = DATOS.etiquetas;

// Tema: el que tengas guardado en este navegador; si no, el de tu configuracion al generar.
document.documentElement.dataset.theme = DATOS.tema || "warm";
try { const t = localStorage.getItem("m3m0ria_theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
const temaSel = document.getElementById("tema");
temaSel.value = document.documentElement.dataset.theme;
temaSel.addEventListener("change", () => {
  document.documentElement.dataset.theme = temaSel.value;
  try { localStorage.setItem("m3m0ria_theme", temaSel.value); } catch (_) {}
});

const norm = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function marcar(texto, terminos) {
  texto = texto || "";
  if (!terminos.length) return esc(texto);
  const base = norm(texto), rangos = [];
  for (const t of terminos) { let i = base.indexOf(t); while (i >= 0) { rangos.push([i, i + t.length]); i = base.indexOf(t, i + t.length); } }
  if (!rangos.length) return esc(texto);
  rangos.sort((a, b) => a[0] - b[0]);
  let out = "", pos = 0;
  for (const [a, b] of rangos) { if (a < pos) continue; out += esc(texto.slice(pos, a)) + "<mark>" + esc(texto.slice(a, b)) + "</mark>"; pos = b; }
  return out + esc(texto.slice(pos));
}
const nombreMes = (m) => { const [a, n] = m.split("-"); return n ? `${MESES[+n - 1]} ${a}` : m; };
const etq = (grupo, v) => (ETQ[grupo] && ETQ[grupo][v]) || v || "sin dato";
function enlaceObsidian(nota) { return nota ? `obsidian://open?vault=${encodeURIComponent(DATOS.vault)}&file=${encodeURIComponent(nota)}` : ""; }

// Texto de busqueda de cada imagen: todo lo que se ve, mas proveedor, generador, modelo y proyecto.
DATOS.grupos.forEach((g) => g.imgs.forEach((im) => {
  im.busca = norm([g.titulo, g.proyecto, im.titulo, im.prompt, im.pet, etq("proveedor", im.prov),
                   etq("generador", im.gen), im.modelo, etq("origen", im.origen)].join(" "));
}));

// Opciones de los filtros: solo las que existen en tus datos.
function rellenar(id, valores, grupo) {
  const sel = document.getElementById(id);
  [...new Set(valores)].filter((v) => v !== undefined && v !== null && v !== "").sort()
    .forEach((v) => { const o = document.createElement("option"); o.value = v; o.textContent = grupo ? etq(grupo, v) : (id === "f-mes" ? nombreMes(v) : v); sel.appendChild(o); });
}
const todasImgs = DATOS.grupos.flatMap((g) => g.imgs);
rellenar("f-prov", todasImgs.map((i) => i.prov), "proveedor");
rellenar("f-gen", todasImgs.map((i) => i.gen), "generador");
rellenar("f-proy", DATOS.grupos.map((g) => g.proyecto));
rellenar("f-mes", DATOS.grupos.map((g) => (g.fecha || "").slice(0, 7)).reverse());
const FILTROS = ["f-prov", "f-origen", "f-tipo", "f-gen", "f-proy", "f-mes"];
// Un filtro es un desplegable o un segmentado (pocas opciones: botones con estado).
const valor = (id) => { const el = document.getElementById(id); return el.classList.contains("seg") ? el.dataset.valor : el.value; };
function poner(id, v) {
  const el = document.getElementById(id);
  if (!el.classList.contains("seg")) { el.value = v; return; }
  el.dataset.valor = v;
  el.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
}
document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) { poner(seg.id, b.dataset.v); pintar(); }
}));
const panel = document.getElementById("panel-filtros"), botonFiltros = document.getElementById("b-filtros");
botonFiltros.addEventListener("click", () => {
  panel.hidden = !panel.hidden;
  botonFiltros.setAttribute("aria-expanded", String(!panel.hidden));
  ajustarCabecera();
});

function pasa(g, im, f, terminos) {
  if (f["f-prov"] && im.prov !== f["f-prov"]) return false;
  if (f["f-origen"] && im.origen !== f["f-origen"]) return false;
  if (f["f-tipo"] && im.tipo !== f["f-tipo"]) return false;
  if (f["f-gen"] && im.gen !== f["f-gen"]) return false;
  if (f["f-proy"] && g.proyecto !== f["f-proy"]) return false;
  if (f["f-mes"] && !(g.fecha || "").startsWith(f["f-mes"])) return false;
  return terminos.every((t) => im.busca.includes(t));
}

function celda(im) {
  if (im.tipo === "video") return `<video src="${esc(im.o)}" preload="metadata" muted></video><span class="insignia">▶ vídeo</span>`;
  if (im.t) return `<img src="${esc(im.t)}" alt="${esc(im.titulo)}" loading="lazy">`;
  return `<div class="sin-mini">sin miniatura</div>`;
}
function portada(im) {
  if (!im) return "";
  if (im.tipo === "video") return "▶";
  return im.t ? `<img src="${esc(im.t)}" alt="" loading="lazy">` : "";
}

let visibles = [], terminosActuales = [];
const plegarBtn = document.getElementById("plegar");
function pintar() {
  const terminos = norm(document.getElementById("q").value).split(/\s+/).filter(Boolean);
  terminosActuales = terminos;
  const f = {};
  FILTROS.forEach((id) => { f[id] = valor(id); document.getElementById(id).classList.toggle("activo", !!f[id]); });
  const activos = FILTROS.filter((id) => f[id]).length;
  document.getElementById("n-filtros").textContent = activos ? String(activos) : "";
  const lista = document.getElementById("lista");
  lista.innerHTML = "";
  visibles = [];
  let nGrupos = 0, nImg = 0, seccion = null, mesActual = null, cuentaMes = null;
  for (const g of DATOS.grupos) {
    const imgs = g.imgs.filter((im) => pasa(g, im, f, terminos));
    if (!imgs.length) continue;
    const m = (g.fecha || "sin fecha").slice(0, 7);
    if (m !== mesActual) {
      mesActual = m;
      seccion = document.createElement("section"); seccion.className = "mes";
      seccion.innerHTML = `<h2>${esc(m.includes("-") ? nombreMes(m) : m)}<span>0</span></h2>`;
      cuentaMes = seccion.querySelector("h2 span");
      lista.appendChild(seccion);
    }
    cuentaMes.textContent = +cuentaMes.textContent + imgs.length;
    nGrupos++; nImg += imgs.length;
    const d = document.createElement("details"); d.className = "conv";
    const provs = [...new Set(imgs.map((i) => i.prov))].map((p) => `<span class="etq-prov">${esc(etq("proveedor", p))}</span>`).join("");
    const pet = imgs.find((i) => i.pet);
    d.innerHTML = `<summary><span class="portada">${portada(imgs.find((i) => i.t) || imgs[0])}</span><span class="fecha">${esc(g.fecha)}</span>
      <span class="titulo">${marcar(g.titulo, terminos)}</span><span class="etiquetas">${provs}</span><span class="cuenta">${imgs.length}</span></summary>
      <div class="cuerpo"><div class="tira"></div><div class="pie-conv">
      ${pet ? `<span class="peticion">Pediste: <em>${marcar(pet.pet, terminos)}</em></span>` : `<span class="peticion"></span>`}
      ${g.proyecto && g.proyecto !== "none" ? `<span class="etq-prov">${marcar(g.proyecto, terminos)}</span>` : ""}
      ${g.nota ? `<a href="${enlaceObsidian(g.nota)}">↗ Abrir en Obsidian</a>` : ""}</div></div>`;
    // La tira se pinta al desplegar: con miles de imagenes, pintarlas todas de golpe congela la pagina.
    const base = visibles.length;
    imgs.forEach((im) => visibles.push({ im, g }));
    d.addEventListener("toggle", () => { if (d.open && !d.dataset.pintada) pintarTira(d, imgs, base); });
    if (terminos.length) { d.open = true; }
    seccion.appendChild(d);
  }
  if (!nGrupos) lista.innerHTML = `<div class="vacio">Nada coincide con la búsqueda o los filtros.</div>`;
  const total = todasImgs.length;
  document.getElementById("resumen").innerHTML =
    `<b>${nImg}</b> de ${total} en <b>${nGrupos}</b> conversaciones` + (DATOS.generado ? ` · generada ${esc(DATOS.generado)}` : "");
  plegarBtn.textContent = "Desplegar todo";
}
function pintarTira(d, imgs, base) {
  d.dataset.pintada = "1";
  const tira = d.querySelector(".tira");
  imgs.forEach((im, k) => {
    const fig = document.createElement("figure");
    const texto = im.titulo ? `<strong>${marcar(im.titulo, terminosActuales)}</strong>` : marcar(im.prompt || im.pet || "", terminosActuales);
    fig.innerHTML = celda(im) + (im.origen === "subida" ? `<span class="insignia">subida</span>` : "") + `<div class="pie">${texto}</div>`;
    fig.addEventListener("click", () => abrir(base + k));
    tira.appendChild(fig);
  });
}

let actual = -1;
function abrir(i) {
  actual = (i + visibles.length) % visibles.length;
  const { im, g } = visibles[actual];
  const medio = document.getElementById("v-medio");
  medio.innerHTML = im.tipo === "video" ? `<video src="${esc(im.o)}" controls autoplay></video>` : `<img src="${esc(im.o)}" alt="">`;
  document.getElementById("v-titulo").textContent = im.titulo || g.titulo;
  document.getElementById("v-meta").textContent = `${im.hora || im.fecha || g.fecha} · ${g.titulo}`;
  const datos = [etq("proveedor", im.prov), etq("origen", im.origen), im.gen && etq("generador", im.gen), im.modelo,
                 im.ed && "edición de otra imagen", g.proyecto && g.proyecto !== "none" && g.proyecto].filter(Boolean);
  document.getElementById("v-datos").innerHTML = datos.map((x) => `<span class="etq-prov">${esc(x)}</span>`).join("");
  document.getElementById("v-prompt").textContent = im.prompt || "";
  document.getElementById("v-prompt-b").style.display = im.prompt ? "" : "none";
  document.getElementById("v-pet").textContent = im.pet || "";
  document.getElementById("v-pet-b").style.display = im.pet ? "" : "none";
  const nota = im.nota || g.nota;
  const obs = document.getElementById("v-obs");
  obs.style.display = nota ? "" : "none";
  obs.href = enlaceObsidian(nota);
  document.getElementById("v-orig").href = im.o;
  document.getElementById("visor").classList.add("abierto");
}
function cerrar() { document.getElementById("visor").classList.remove("abierto"); document.getElementById("v-medio").innerHTML = ""; }
document.getElementById("cerrar").onclick = cerrar;
document.getElementById("ant").onclick = (e) => { e.stopPropagation(); abrir(actual - 1); };
document.getElementById("sig").onclick = (e) => { e.stopPropagation(); abrir(actual + 1); };
document.getElementById("lienzo").addEventListener("click", (e) => { if (e.target.id === "lienzo") cerrar(); });
document.addEventListener("keydown", (e) => {
  const abierto = document.getElementById("visor").classList.contains("abierto");
  if (e.key === "/" && document.activeElement.id !== "q") { e.preventDefault(); document.getElementById("q").focus(); }
  if (!abierto) return;
  if (e.key === "Escape") cerrar();
  if (e.key === "ArrowLeft") abrir(actual - 1);
  if (e.key === "ArrowRight") abrir(actual + 1);
});
plegarBtn.addEventListener("click", () => {
  const abrirTodo = plegarBtn.textContent.startsWith("Desplegar");
  document.querySelectorAll("details.conv").forEach((d) => (d.open = abrirTodo));
  plegarBtn.textContent = abrirTodo ? "Plegar todo" : "Desplegar todo";
});
document.getElementById("limpiar").addEventListener("click", () => {
  FILTROS.forEach((id) => poner(id, ""));
  document.getElementById("q").value = "";
  pintar();
});
let espera;
document.getElementById("q").addEventListener("input", () => { clearTimeout(espera); espera = setTimeout(pintar, 150); });
FILTROS.forEach((id) => { const el = document.getElementById(id); if (el.tagName === "SELECT") el.addEventListener("change", pintar); });
function ajustarCabecera() { _ajustar(); }
const _ajustar = () => document.documentElement.style.setProperty("--alto-cabecera", document.getElementById("cabecera").offsetHeight + "px");
window.addEventListener("resize", ajustarCabecera);
pintar(); ajustarCabecera();
</script>
</body>
